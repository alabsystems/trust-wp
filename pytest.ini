# Pytest configuration for trust-wp
# Author: Andrew Yates <andrewyates.name@gmail.com>
#
# Global timeout prevents stuck tests from hanging CI.
# Slowest test: ~3.7s, timeout set to 30s (8x headroom).

[pytest]
# Global timeout in seconds - kills tests that hang
timeout = 30
timeout_method = signal

# Fail fast on CI - use -x to stop on first failure
# addopts = -x --tb=short

# Test paths
testpaths = tests

# Ignore deprecation warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:hypothesis.*
    ignore::DeprecationWarning:pytest_timeout.*
