[package]
name = "contract-drop-guards-fixture"
version = "0.1.0"
edition = "2021"

# Empty workspace table to exclude from parent workspace
[workspace]

[dependencies]
trust-wp = { path = "../../../crates/trust-wp" }

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "requires_dropped"
