[package]
name = "proof-assert-fixture"
version = "0.1.0"
edition = "2021"

# Empty workspace table to exclude from parent workspace
[workspace]

[dependencies]
# trust-wp provides proof_assert! and contract macros
trust-wp = { path = "../../../crates/trust-wp" }
trust-wp-std = { path = "../../../crates/trust-wp-std" }
creusot-contracts = { path = "../../../crates/creusot-contracts" }
creusot-std = { path = "../../../crates/creusot-std" }

# Disable the default lib target - we only want to test individual binaries
# Each binary is tested in isolation to avoid cross-module compilation
[lib]
path = "src/lib.rs"
# Only build lib when explicitly requested, not with bins
doctest = false

[[bin]]
name = "should_verify"
path = "src/should_verify.rs"

[[bin]]
name = "should_fail"
path = "src/should_fail.rs"

