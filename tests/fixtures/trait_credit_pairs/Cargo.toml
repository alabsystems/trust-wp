[package]
name = "trait-credit-pairs-fixture"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
creusot-contracts = { path = "../../../crates/creusot-contracts" }
creusot-std = { path = "../../../crates/creusot-std" }
trust-wp = { path = "../../../crates/trust-wp" }
trust-wp-std = { package = "trust-wp-std", path = "../../../crates/trust-wp-std" }

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "pinned_honoured"
path = "src/pinned_honoured.rs"

[[bin]]
name = "pinned_refuted"
path = "src/pinned_refuted.rs"

[[bin]]
name = "axiom_dep_honoured"
path = "src/axiom_dep_honoured.rs"

[[bin]]
name = "axiom_dep_refuted"
path = "src/axiom_dep_refuted.rs"
