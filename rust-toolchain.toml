# ALab systems build with the Trust toolchain (owner directive, D-125). This
# pin names the compiler, not the lane: `targo --unverified` or `targo trust`
# chooses whether verification runs. trust-wp-driver links rustc_private and
# drives the Trust compiler's MIR, so a stock nightly cannot build it either
# (its internals, e.g. Rvalue::NullaryOp arity, differ from the Trust fork's).
# The nested workspaces under iface/ and spikes/ inherit this pin.
[toolchain]
channel = "trust"
