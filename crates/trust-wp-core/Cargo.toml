# trust-wp-core - contract/formula core and SMT output
# Author: Andrew Yates <andrewyates.name@gmail.com>

[package]
name = "trust-wp-core"
description = "Core verification logic for trust-wp"
version.workspace = true
edition.workspace = true
# rust-version omitted: requires nightly
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
tracing-init = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
num-bigint = { workspace = true }
sha2 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "smt_encoding"
harness = false

[lints]
workspace = true
