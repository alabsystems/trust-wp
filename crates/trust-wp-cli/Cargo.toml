# trust-wp-cli - the `trust-wp` command-line front door
# Author: Andrew Yates <andrewyates.name@gmail.com>
#
# Standalone on purpose: this package depends on trust-wp-core only (no
# rustc_private, no solver), so the `trust-wp` binary builds everywhere the
# WP core builds and ships in the public snapshot. The engine binaries
# (`trust-wp-rustc`, `targo-trust-wp`) are located at run time, exactly as
# `targo-trust-wp` locates the driver.

[package]
name = "trust-wp-cli"
description = "trust-wp command-line interface: the `trust-wp` binary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trust-wp-core = { workspace = true, features = ["tracing-init"] }
serde_json = "1"

[dev-dependencies]
ntest = "0.9"
serde_json = "1"
tempfile = "3.10"
trust-wp-test-utils = { workspace = true }

[[bin]]
name = "trust-wp"
path = "src/main.rs"

[lints]
workspace = true
