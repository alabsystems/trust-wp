# targo-trust-wp - Targo/Cargo subcommand for trust-wp verification
# Author: Andrew Yates <andrewyates.name@gmail.com>
#
# Trust-native name is `targo-trust-wp`, invoked `targo trust-wp`. The legacy
# `cargo-trust-wp` [[bin]] alias below is retained for back-compat so that
# `cargo trust-wp` discovery and existing scripts/docs keep working unchanged.
# The package directory stays `crates/cargo-trust-wp` on purpose (only the
# package/bin names and invocation are Trust-native, not the repo layout).

[package]
name = "targo-trust-wp"
description = "Targo/Cargo subcommand for trust-wp verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trust-wp-core = { workspace = true, features = ["tracing-init"] }
tracing = { workspace = true }

[dev-dependencies]
ntest = "0.9"
trust-wp-test-utils = { workspace = true }
tempfile = "3.10"

# Trust-native primary: invoked as `targo trust-wp`.
[[bin]]
name = "targo-trust-wp"
path = "src/main.rs"

# Back-compat alias: keeps `cargo trust-wp` discovery and existing
# scripts/docs/tests (which resolve a `cargo-trust-wp` binary by name) working.
# Same entry point as the primary bin.
[[bin]]
name = "cargo-trust-wp"
path = "src/main.rs"

[lints]
workspace = true
