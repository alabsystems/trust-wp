# `iface/trust-spec-iface` is its own `[workspace]`, but Cargo's config
# discovery walks parent DIRECTORIES and ignores workspace boundaries, so a
# targo run here inherits the repository-root `../.cargo/config.toml`. That
# config names trust-wp's rustc_private wrapper, which this crate does not
# link and must not be compiled through; the empty string means "no wrapper".
[build]
rustc-wrapper = ""
