# trust-wp - Deductive verification for Rust
# Author: Andrew Yates <andrewyates.name@gmail.com>

[workspace]
resolver = "2"
# Nested standalone workspaces (own [workspace] roots): the INTERFACE-v1 reference crate
# and the spike suite build on stable with their own lockfiles; excluded here so
# path-deps into them (e.g. trust-wp-driver → trust-spec-iface behind the clean-kernel
# feature) do not conflict with this workspace root.
exclude = ["iface/trust-spec-iface", "spikes"]
members = [
    "crates/cargo-trust-wp",
    "crates/creusot-contracts",
    "crates/creusot-std",
    "crates/trust-wp",
    "crates/trust-wp-core",
    "crates/trust-wp-macros",
    "crates/trust-wp-std",
    "crates/trust-wp-test-utils",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# rust-version omitted: requires nightly for rustc_private
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/alabsystems/trust-wp"

[workspace.dependencies]
# Internal crates
# Package renamed to `targo-trust-wp` (Trust-native; invoked `targo trust-wp`).
# Directory kept as crates/cargo-trust-wp. The crate also ships a back-compat
# `cargo-trust-wp` [[bin]] alias so `cargo trust-wp` keeps working.
targo-trust-wp = { path = "crates/cargo-trust-wp" }
creusot-contracts = { path = "crates/creusot-contracts" }
creusot-std = { path = "crates/creusot-std" }
trust-wp = { path = "crates/trust-wp" }
trust-wp-core = { path = "crates/trust-wp-core" }
trust-wp-macros = { path = "crates/trust-wp-macros" }
trust-wp-std = { path = "crates/trust-wp-std" }
trust-wp-test-utils = { path = "crates/trust-wp-test-utils" }

# The ay SMT backend (crates/trust-wp-ay), the rustc-driver (crates/trust-wp-driver),
# the lib facade (crates/trust-wp-lib), their `trust-ir` proof-IR bundle, and
# the first-party `ay` solver dependency are omitted from this public
# snapshot: `ay` is not yet public. See publish/DECISIONS.md.


# Proc macro support
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit", "fold"] }

# Numeric (ay model extraction uses BigInt)
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"

# Common utilities
thiserror = "2.0"
log = "0.4"
stacker = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
trybuild = "1.0"
proptest = "1.5"

[workspace.lints.rust]
# Note: trust-wp-driver requires unsafe for rustc_private (lifetime transmutes)
# See reference/creusot/creusot/src/callbacks.rs for the pattern
# unsafe_code = "forbid" disabled for rustc_private compatibility
# Allow cfg conditions set by trust-wp-driver and opt-in solver proof benchmarks.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trust_wp)', 'cfg(ay_performance_proofs)'] }
unused_assignments = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Spec/trait definitions often lack these sections
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Spec code uses patterns that trigger these
return_self_not_must_use = "allow"
needless_raw_string_hashes = "allow"
should_implement_trait = "allow"
result_unit_err = "allow"
implicit_hasher = "allow"
match_wild_err_arm = "allow"
elidable_lifetime_names = "allow"
uninlined_format_args = "allow"
cast_lossless = "allow"
manual_is_multiple_of = "allow"
unnecessary_map_or = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
# Doc formatting in spec comments uses function-style notation
doc_markdown = "allow"
# &[x.clone()] is a common, readable pattern; std::slice::from_ref is less clear
cloned_ref_to_slice_refs = "allow"
# EncodingError is large (SortConflict variant ~128 bytes) but pervasive;
# boxing would require rewriting all error-handling call sites in trust-wp-ay
result_large_err = "allow"
# Verifier functions consume args by value for builder/fold patterns.
needless_pass_by_value = "allow"
# Decision/error enums carry a large payload variant but are short-lived;
# boxing would churn pervasive match sites for no real gain.
large_enum_variant = "allow"
# Spec/doc comments use list-style notation that trips lazy-continuation.
doc_lazy_continuation = "allow"
# Style/pedantic lints the verifier deliberately does not chase (explicit
# boolean logic, guards, and blocks aid soundness review); consistent with the
# allow set above and trust-mc's policy.
redundant_guards = "allow"
nonminimal_bool = "allow"
if_same_then_else = "allow"
field_reassign_with_default = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
no_effect_underscore_binding = "allow"
cast_possible_wrap = "allow"
match_like_matches_macro = "allow"
ref_option = "allow"
# if/cmp chains and single-char math/permutation bindings are clearer as-is.
comparison_chain = "allow"
many_single_char_names = "allow"

[workspace.metadata.atpkg]
# SHIPPING — but NOT from this bin lane. `expose = []` below is correct and must
# stay empty; trust-wp reaches users inside the `trust` SYSROOT BUNDLE.
#
# The commands: `targo-trust-wp` (the clippy-shaped front end, invoked
# `targo trust-wp`; back-compat bin alias `cargo-trust-wp`) and `trust-wp-driver`
# (the driver doing the real weakest-precondition work, back-compat bin alias
# `trust-wp-rustc`, also usable directly as
# `trust-wp-driver file.rs --crate-type=lib -- --force`).
#
# STATUS (verified 2026-08-15 against the signed pkg-trust-5520.toml published
# 2026-08-11 to alabsystems/trust): all five bins ship in the trust bundle and are
# in its `exposes` list — targo-trust-wp, trust-wp-driver, trust-wp,
# cargo-trust-wp, trust-wp-rustc.
#
# RELOCATABILITY — SOLVED 2026-07-30, and confirmed in the shipped artifact.
# scripts/trustc-private-wrapper.sh emits @executable_path/../lib and
# @loader_path/../lib BEFORE the four machine-local absolute rpaths. At pack time
# `atpkg relocate` DELETES every machine-local rpath (aterm crates/atpkg/src/
# relocate.rs is_machine_local), so the loader-relative pair is all that survives —
# and it is what resolves @rpath/librustc_driver-<hash>.dylib out of the bundle's
# own lib/. otool on the shipped bin/trust-wp-driver shows exactly three LC_RPATHs:
#   @executable_path/../lib, @loader_path/../lib, @loader_path/../lib/atpkg-vendored
# Hiding that lib/ makes it die with "Library not loaded: @rpath/librustc_driver-…",
# proving the loader-relative entries are load-bearing rather than decorative.
# Only trust_wp_driver / trust_wp_rustc get this treatment (is_driver_bin matches
# the crate name), so build scripts never get -Cprefer-dynamic; the three front-end
# bins link statically and carry no rpaths at all.
#
# WHY NOT A STANDALONE MEMBER: trust-wp needs a Trust sysroot at RUNTIME, so it can
# only ever ship ALONGSIDE the `trust` bundle (the `rustc` coherence group).
# ay-core and ay-dpll are also exact path deps on the sibling ay checkout, so the
# build host must carry it at the pinned rev. (Spelled without the literal
# relative path on purpose: publish transform T1 treats that string as a private
# dependency marker and refuses the export when it survives into the snapshot.)
#
#     when bundled:  EXPOSES="targo-trust-wp trust-wp-driver trust-wp"
#                    (plus back-compat alias bins cargo-trust-wp, trust-wp-rustc)
#     KNOWN DRIFT: the bins in build 5520 were compiled 2026-08-01; five trust-wp
#     commits have landed since (through a224bb25), touching the encoder and the
#     driver's ADT analysis. The next trust bundle re-pack picks them up.
expose = []
