# Public Cargo configuration — installed into the export as .cargo/config.toml
# by publish/transforms.sh (the dev .cargo/config.toml is not exported: it
# names scripts/trustc-private-wrapper.sh, a dev-only rustc wrapper).
#
# trust-wp builds with the Trust toolchain (rust-toolchain.toml pins
# channel = "trust"; build it from https://github.com/alabsystems/trust, or
# register an existing stage2 with the trust repo's rustup link script). The
# Trust compiler's verification pass is fail-closed BY DEFAULT and would try
# to prove panic-freedom for every unit, including third-party build scripts.
# Building the verifier itself is not a verification run, so the pass is off
# here — the same off-switch the dev config carries.
#
# rust-toolchain.toml pins the trust channel for every cargo invocation in
# this repo, so a stock toolchain (which rejects -Ztrust-verify as unknown)
# never sees these flags.

[build]
rustflags = ["-Ztrust-verify=off"]
rustdocflags = ["-Ztrust-verify=off"]

[net]
git-fetch-with-cli = true

[env]
RUST_MIN_STACK = { value = "16777216", force = false }
