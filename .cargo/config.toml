# Public Cargo configuration — installed into the export as .cargo/config.toml
# by publish/transforms.sh (the dev .cargo/config.toml is not exported: it
# names scripts/trustc-private-wrapper.sh, a dev-only rustc wrapper).
#
# trust-wp builds with the Trust toolchain (rust-toolchain.toml pins
# channel = "trust"). Install aterm (https://github.com/alabsystems/aterm);
# atpkg installs Trust and links it as the `trust` rustup toolchain (atpkg
# ships Trust for Apple-silicon macOS only; no other platform has a public
# Trust package or supported install path today). Build through the Trust
# toolchain's own cargo, targo, which names the lane: `targo --unverified
# <verb>` switches the Trust verification pass off for every unit (build
# scripts, proc macros and doctests included), `targo trust <verb>` verifies
# with per-unit scoping. The release gate (publish/config.sh) runs both.
#
# So this file carries NO verification off-switch. A `[host]` off-switch table
# makes `targo trust` refuse the whole run, and the other off-switch tables
# served only lane-less cargo; T3 refuses any of them in the installed copy.
[net]
git-fetch-with-cli = true

[env]
RUST_MIN_STACK = { value = "16777216", force = false }
